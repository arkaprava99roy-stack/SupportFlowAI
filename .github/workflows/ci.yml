name: SupportFlow AI — CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-tests:
    name: Backend Test & Evaluation Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests evals --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings
          flake8 src tests evals --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Database Migrations & Initial Seed
        run: |
          alembic upgrade head
          python -m src.db.seed

      - name: Run Full Pytest Suite (38 Tests)
        run: |
          pytest -v --cov=src --cov-report=term-missing

      - name: Run 25-Case Eval Benchmark Runner
        run: |
          python -m evals.eval_runner

      - name: Upload Evaluation Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-benchmark-report
          path: evals/results/eval_report.md

  frontend-lint-and-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Vite Production Build
        working-directory: ./frontend
        run: npm run build

  docker-build-verification:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint-and-tests, frontend-lint-and-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: supportflow-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: supportflow-frontend:test
